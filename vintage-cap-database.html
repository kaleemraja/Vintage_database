<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vintage Cap Database</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --primary: #378add;
      --danger: #e24b4a;
      --success: #639922;
      --surface-0: #f1efe8;
      --surface-1: #e8e6df;
      --surface-2: #ffffff;
      --text-primary: #2c2c2a;
      --text-secondary: #888780;
      --text-muted: #b4b2a9;
      --border: rgba(0, 0, 0, 0.08);
      --radius: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface-0: #1a1a18;
        --surface-1: #25251f;
        --surface-2: #2c2c2a;
        --text-primary: #efefeb;
        --text-secondary: #a9a8a0;
        --text-muted: #6b6b68;
        --border: rgba(255, 255, 255, 0.08);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: var(--surface-0);
      color: var(--text-primary);
      padding: 16px;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .header p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 0.5px solid var(--border);
      padding-bottom: 12px;
    }

    .nav-btn {
      flex: 1;
      padding: 10px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      transition: background 0.2s;
    }

    .nav-btn.active {
      background: var(--surface-1);
    }

    .nav-btn:hover {
      background: var(--surface-1);
    }

    .hidden {
      display: none !important;
    }

    /* Gallery View */
    .search-box {
      position: relative;
      margin-bottom: 12px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 10px 10px 40px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      background: var(--surface-2);
      color: var(--text-primary);
    }

    .search-box i {
      position: absolute;
      left: 12px;
      top: 11px;
      color: var(--text-secondary);
      pointer-events: none;
    }

    .filter-select {
      width: 100%;
      padding: 10px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      background: var(--surface-2);
      color: var(--text-primary);
      margin-bottom: 16px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }

    .empty-state i {
      font-size: 48px;
      display: block;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .cap-card {
      background: var(--surface-2);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .cap-card:hover {
      border-color: var(--text-secondary);
    }

    .cap-card-image {
      aspect-ratio: 1;
      background: var(--surface-1);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .cap-card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cap-card-image i {
      font-size: 32px;
      color: var(--text-muted);
    }

    .cap-card-info {
      padding: 12px;
    }

    .cap-card-brand {
      margin: 0 0 4px;
      font-weight: 500;
      font-size: 14px;
    }

    .cap-card-era {
      margin: 0 0 4px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .cap-card-tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .cap-tag {
      font-size: 11px;
      background: var(--surface-1);
      padding: 2px 8px;
      border-radius: var(--radius);
      color: var(--text-secondary);
    }

    /* Form */
    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-secondary);
    }

    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;
      padding: 10px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      background: var(--surface-2);
      color: var(--text-primary);
      font-family: inherit;
    }

    .form-textarea {
      min-height: 80px;
      resize: vertical;
    }

    .photo-upload {
      display: block;
      padding: 24px;
      border: 0.5px dashed var(--border);
      border-radius: var(--radius);
      text-align: center;
      cursor: pointer;
      background: var(--surface-1);
      font-size: 14px;
      transition: background 0.2s;
    }

    .photo-upload:hover {
      background: var(--surface-0);
    }

    .photo-upload i {
      font-size: 24px;
      display: block;
      margin-bottom: 8px;
      color: var(--text-secondary);
    }

    .photo-upload input {
      display: none;
    }

    .photo-preview {
      margin-top: 12px;
      width: 100%;
      max-height: 200px;
      border-radius: var(--radius);
      object-fit: cover;
    }

    .btn {
      padding: 12px 16px;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
      width: 100%;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:active {
      opacity: 0.9;
    }

    .btn-danger {
      background: var(--danger);
      color: white;
      margin-top: 12px;
    }

    .btn-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--text-primary);
      width: auto;
      padding: 0;
    }

    /* Modal */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: flex-end;
      z-index: 1000;
    }

    .modal.hidden {
      display: none;
    }

    .modal-content {
      width: 100%;
      background: var(--surface-2);
      border-radius: 12px 12px 0 0;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 500;
    }

    .modal-image {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 16px;
      max-height: 300px;
      object-fit: cover;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .modal-stat {
      background: var(--surface-1);
      padding: 12px;
      border-radius: var(--radius);
    }

    .modal-stat-label {
      margin: 0 0 4px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .modal-stat-value {
      margin: 0;
      font-size: 14px;
      font-weight: 500;
    }

    .modal-section {
      margin-bottom: 16px;
    }

    .modal-section-label {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .modal-section-text {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
    }

    .modal-date {
      margin: 0 0 16px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .form-submit-group {
      margin-top: 12px;
    }

    i {
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🧢 Vintage Cap Database</h1>
      <p>Track and compare your collection</p>
    </div>

    <!-- Navigation -->
    <div class="nav-tabs">
      <button class="nav-btn active" onclick="switchTab('gallery')">
        <i class="fas fa-th"></i> Gallery
      </button>
      <button class="nav-btn" onclick="switchTab('add')">
        <i class="fas fa-plus"></i> Add cap
      </button>
    </div>

    <!-- Gallery View -->
    <div id="gallery-view" class="gallery-view">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search by brand or feature" onkeyup="filterCaps()">
      </div>

      <select id="rarityFilter" class="filter-select" onchange="filterCaps()">
        <option value="all">All rarity levels</option>
        <option value="common">Common</option>
        <option value="uncommon">Uncommon</option>
        <option value="rare">Rare</option>
        <option value="extremely rare">Extremely rare</option>
      </select>

      <div id="galleryContainer" class="gallery"></div>
      <div id="emptyState" class="empty-state hidden">
        <i class="fas fa-inbox"></i>
        <p id="emptyText">No caps yet. Add your first one!</p>
      </div>
    </div>

    <!-- Add Cap Form -->
    <div id="add-view" class="hidden">
      <form onsubmit="addCap(event)">
        <div class="form-group">
          <label class="form-label">Brand</label>
          <input type="text" id="brand" class="form-input" placeholder="Nike, Adidas, band logo, etc." required>
        </div>

        <div class="form-group">
          <label class="form-label">Era / Year</label>
          <input type="text" id="era" class="form-input" placeholder="1990s, 1985, etc.">
        </div>

        <div class="form-group">
          <label class="form-label">Condition</label>
          <select id="condition" class="form-select">
            <option value="mint">Mint</option>
            <option value="excellent">Excellent</option>
            <option value="good" selected>Good</option>
            <option value="fair">Fair</option>
            <option value="poor">Poor</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Rarity</label>
          <select id="rarity" class="form-select">
            <option value="common">Common</option>
            <option value="uncommon" selected>Uncommon</option>
            <option value="rare">Rare</option>
            <option value="extremely rare">Extremely rare</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Est. value</label>
          <input type="text" id="value" class="form-input" placeholder="$50-150, $500+">
        </div>

        <div class="form-group">
          <label class="form-label">Key features</label>
          <textarea id="keyFeatures" class="form-textarea" placeholder="Embroidered logo, specific tag, manufacturing details..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Notes</label>
          <textarea id="notes" class="form-textarea" placeholder="Selling history, interesting backstory..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Photo</label>
          <label class="photo-upload" id="photoLabel">
            <i class="fas fa-image"></i>
            <span id="photoText">Tap to add photo</span>
            <input type="file" id="photoInput" accept="image/*" onchange="handlePhotoUpload()">
          </label>
          <img id="photoPreview" class="photo-preview hidden">
        </div>

        <div class="form-submit-group">
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-plus"></i> Add to database
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalBrand"></h2>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>
      <img id="modalImage" class="modal-image hidden">
      <div class="modal-grid">
        <div class="modal-stat">
          <p class="modal-stat-label">Era</p>
          <p class="modal-stat-value" id="modalEra">Unknown</p>
        </div>
        <div class="modal-stat">
          <p class="modal-stat-label">Condition</p>
          <p class="modal-stat-value" id="modalCondition"></p>
        </div>
        <div class="modal-stat">
          <p class="modal-stat-label">Rarity</p>
          <p class="modal-stat-value" id="modalRarity"></p>
        </div>
        <div class="modal-stat">
          <p class="modal-stat-label">Est. value</p>
          <p class="modal-stat-value" id="modalValue">—</p>
        </div>
      </div>
      <div id="keyFeaturesSection" class="modal-section hidden">
        <p class="modal-section-label">Key features</p>
        <p class="modal-section-text" id="modalKeyFeatures"></p>
      </div>
      <div id="notesSection" class="modal-section hidden">
        <p class="modal-section-label">Notes</p>
        <p class="modal-section-text" id="modalNotes"></p>
      </div>
      <p class="modal-date" id="modalDate"></p>
      <button class="btn btn-danger" onclick="deleteCap()">
        <i class="fas fa-trash"></i> Delete from database
      </button>
    </div>
  </div>

  <script>
    let caps = [];
    let selectedCapId = null;

    // Load caps on page load
    window.addEventListener('DOMContentLoaded', () => {
      loadCaps();
      renderGallery();
    });

    function loadCaps() {
      const saved = localStorage.getItem('vintage_caps');
      if (saved) {
        try {
          caps = JSON.parse(saved);
        } catch (e) {
          console.error('Failed to load caps:', e);
        }
      }
    }

    function saveCaps() {
      localStorage.setItem('vintage_caps', JSON.stringify(caps));
    }

    function switchTab(tab) {
      const galleryView = document.getElementById('gallery-view');
      const addView = document.getElementById('add-view');
      const navBtns = document.querySelectorAll('.nav-btn');

      navBtns.forEach(btn => btn.classList.remove('active'));
      event.target.closest('.nav-btn').classList.add('active');

      if (tab === 'gallery') {
        galleryView.classList.remove('hidden');
        addView.classList.add('hidden');
        renderGallery();
      } else {
        galleryView.classList.add('hidden');
        addView.classList.remove('hidden');
      }
    }

    function handlePhotoUpload() {
      const file = document.getElementById('photoInput').files[0];
      if (file) {
        const reader = new FileReader();
        reader.onloadend = () => {
          window.photoData = reader.result;
          document.getElementById('photoText').textContent = 'Photo added ✓';
          document.getElementById('photoPreview').src = reader.result;
          document.getElementById('photoPreview').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    function addCap(e) {
      e.preventDefault();

      const brand = document.getElementById('brand').value.trim();
      if (!brand) {
        alert('Please enter a brand');
        return;
      }

      const newCap = {
        id: Date.now(),
        brand: brand,
        era: document.getElementById('era').value,
        condition: document.getElementById('condition').value,
        rarity: document.getElementById('rarity').value,
        value: document.getElementById('value').value,
        keyFeatures: document.getElementById('keyFeatures').value,
        notes: document.getElementById('notes').value,
        photo: window.photoData || null,
        dateAdded: new Date().toLocaleDateString()
      };

      caps.unshift(newCap);
      saveCaps();

      // Reset form
      document.querySelector('form').reset();
      window.photoData = null;
      document.getElementById('photoText').textContent = 'Tap to add photo';
      document.getElementById('photoPreview').classList.add('hidden');

      // Switch to gallery
      document.querySelector('.nav-btn:first-child').click();
    }

    function renderGallery() {
      const container = document.getElementById('galleryContainer');
      const emptyState = document.getElementById('emptyState');

      if (caps.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        document.getElementById('emptyText').textContent = 'No caps yet. Add your first one!';
        return;
      }

      emptyState.classList.add('hidden');
      container.innerHTML = caps.map(cap => `
        <div class="cap-card" onclick="openModal(${cap.id})">
          <div class="cap-card-image">
            ${cap.photo ? `<img src="${cap.photo}" alt="${cap.brand}">` : '<i class="fas fa-image"></i>'}
          </div>
          <div class="cap-card-info">
            <p class="cap-card-brand">${cap.brand}</p>
            <p class="cap-card-era">${cap.era || ''}</p>
            <div class="cap-card-tags">
              <span class="cap-tag">${cap.condition}</span>
              <span class="cap-tag">${cap.rarity}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterCaps() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const rarityFilter = document.getElementById('rarityFilter').value;

      const filtered = caps.filter(cap => {
        const matchesSearch = cap.brand.toLowerCase().includes(searchTerm) ||
                             cap.keyFeatures.toLowerCase().includes(searchTerm);
        const matchesRarity = rarityFilter === 'all' || cap.rarity === rarityFilter;
        return matchesSearch && matchesRarity;
      });

      const container = document.getElementById('galleryContainer');
      const emptyState = document.getElementById('emptyState');

      if (filtered.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        document.getElementById('emptyText').textContent = 'No matches found.';
        return;
      }

      emptyState.classList.add('hidden');
      container.innerHTML = filtered.map(cap => `
        <div class="cap-card" onclick="openModal(${cap.id})">
          <div class="cap-card-image">
            ${cap.photo ? `<img src="${cap.photo}" alt="${cap.brand}">` : '<i class="fas fa-image"></i>'}
          </div>
          <div class="cap-card-info">
            <p class="cap-card-brand">${cap.brand}</p>
            <p class="cap-card-era">${cap.era || ''}</p>
            <div class="cap-card-tags">
              <span class="cap-tag">${cap.condition}</span>
              <span class="cap-tag">${cap.rarity}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function openModal(id) {
      const cap = caps.find(c => c.id === id);
      if (!cap) return;

      selectedCapId = id;

      document.getElementById('modalBrand').textContent = cap.brand;
      document.getElementById('modalEra').textContent = cap.era || 'Unknown';
      document.getElementById('modalCondition').textContent = cap.condition;
      document.getElementById('modalRarity').textContent = cap.rarity;
      document.getElementById('modalValue').textContent = cap.value || '—';
      document.getElementById('modalDate').textContent = `Added ${cap.dateAdded}`;

      const keyFeaturesSection = document.getElementById('keyFeaturesSection');
      if (cap.keyFeatures) {
        document.getElementById('modalKeyFeatures').textContent = cap.keyFeatures;
        keyFeaturesSection.classList.remove('hidden');
      } else {
        keyFeaturesSection.classList.add('hidden');
      }

      const notesSection = document.getElementById('notesSection');
      if (cap.notes) {
        document.getElementById('modalNotes').textContent = cap.notes;
        notesSection.classList.remove('hidden');
      } else {
        notesSection.classList.add('hidden');
      }

      const modalImage = document.getElementById('modalImage');
      if (cap.photo) {
        modalImage.src = cap.photo;
        modalImage.classList.remove('hidden');
      } else {
        modalImage.classList.add('hidden');
      }

      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      selectedCapId = null;
    }

    function deleteCap() {
      if (!confirm('Delete this cap from your database?')) return;

      caps = caps.filter(c => c.id !== selectedCapId);
      saveCaps();
      closeModal();
      renderGallery();
    }

    // Close modal when clicking outside
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') {
        closeModal();
      }
    });
  </script>
</body>
</html>
